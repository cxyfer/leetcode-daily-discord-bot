name: build-and-push

on:
  push:
    tags:
      - 'v*.*.*'
  pull_request:
    paths:
      - '.github/workflows/ghcr.yml'
      - '.github/release-notes-template.md'
      - 'scripts/release_notes.py'
      - 'scripts/test_release_notes.py'
      - 'Dockerfile'
      - '.dockerignore'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'requirements.txt'
      - 'bot.py'
      - 'src/**'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing version tag to rebuild; leave empty to validate this branch without publishing'
        required: false
        type: string

concurrency:
  group: versioned-image-${{ github.event_name == 'pull_request' && github.ref || 'release' }}
  cancel-in-progress: false
  queue: max

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.release.outputs.publish }}
      tag: ${{ steps.release.outputs.tag }}
      prerelease: ${{ steps.release.outputs.prerelease }}
      image: ${{ steps.image.outputs.image }}
      tags: ${{ steps.image.outputs.tags }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Test release tooling
        run: python3 -S scripts/test_release_notes.py -v

      - name: Validate version tag
        id: release
        env:
          INPUT_TAG: ${{ inputs.tag }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" != 'pull_request' && ( -n "$INPUT_TAG" || "$REF_TYPE" == 'tag' ) ]]; then
            tag="${INPUT_TAG:-$REF_NAME}"
            python3 scripts/release_notes.py metadata "$tag" --github-output "$GITHUB_OUTPUT"
            echo 'publish=true' >> "$GITHUB_OUTPUT"
          else
            echo 'publish=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve image names
        id: image
        env:
          PUBLISH: ${{ steps.release.outputs.publish }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          IS_LATEST: ${{ steps.release.outputs.is_latest_stable }}
        run: |
          set -euo pipefail
          repository="ghcr.io/${GITHUB_REPOSITORY,,}"
          if [[ "$PUBLISH" == 'true' ]]; then
            image="$repository:$RELEASE_TAG"
          else
            image="$repository:build-${GITHUB_SHA:0:12}"
          fi
          echo "image=$image" >> "$GITHUB_OUTPUT"
          {
            echo 'tags<<IMAGE_TAGS'
            echo "$image"
            if [[ "$PUBLISH" == 'true' && "$IS_LATEST" == 'true' ]]; then
              echo "$repository:latest"
            fi
            echo 'IMAGE_TAGS'
          } >> "$GITHUB_OUTPUT"

  check-image:
    name: Build and smoke-test image
    needs: prepare
    if: needs.prepare.outputs.publish != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build validation image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: ${{ needs.prepare.outputs.image }}
          cache-from: type=gha,scope=versioned-image
          cache-to: type=gha,mode=max,scope=versioned-image

      - name: Verify container startup
        env:
          IMAGE: ${{ needs.prepare.outputs.image }}
        run: |
          set -euo pipefail
          docker run --rm --network none \
            --env DISCORD_TOKEN= --env GOOGLE_GEMINI_API_KEY= \
            --entrypoint python "$IMAGE" -c '
          import importlib
          import json
          import runpy
          import sqlite3
          from pathlib import Path

          root = Path("/app")
          assert not (root / "config.toml").exists(), "Image contains runtime configuration"
          assert not (root / ".env").exists(), "Image contains environment configuration"
          runpy.run_path(str(root / "bot.py"), run_name="__main__")
          for module in (
              "bot.cogs.slash_commands_cog",
              "bot.cogs.interaction_handler_cog",
              "bot.cogs.schedule_manager_cog",
          ):
              importlib.import_module(module)
          database = root / "data/data.db"
          assert database.is_file(), "Bot did not initialize its database"
          with sqlite3.connect(database) as connection:
              tables = {row[0] for row in connection.execute("SELECT name FROM sqlite_master WHERE type = ?", ("table",))}
              assert {"server_settings", "llm_translate_results", "llm_inspire_results"} <= tables
              assert connection.execute("PRAGMA quick_check").fetchone() == ("ok",)
          for locale in ("en-US", "zh-TW", "zh-CN"):
              assert json.loads((root / f"src/bot/i18n/locales/{locale}.json").read_text())
          print("Bot launcher, packaged imports, locales and fresh SQLite initialization passed without Discord access.")
          '
          echo "Built and smoke-tested \`$IMAGE\` offline without publishing." >> "$GITHUB_STEP_SUMMARY"

      - name: Export validation image
        env:
          IMAGE: ${{ needs.prepare.outputs.image }}
        run: |
          set -euo pipefail
          docker save "$IMAGE" | gzip > "$RUNNER_TEMP/leetcode-daily-discord-bot-validation-image.tar.gz"

      - uses: actions/upload-artifact@v4
        with:
          name: leetcode-daily-discord-bot-validation-image
          path: ${{ runner.temp }}/leetcode-daily-discord-bot-validation-image.tar.gz
          retention-days: 3
          if-no-files-found: error

  publish-image:
    name: Publish versioned image
    needs: prepare
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push release image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ needs.prepare.outputs.tags }}
          cache-from: type=gha,scope=versioned-image
          cache-to: type=gha,mode=max,scope=versioned-image

      - name: Record published image
        env:
          IMAGE: ${{ needs.prepare.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          echo "Published \`$IMAGE\` (\`$DIGEST\`)." >> "$GITHUB_STEP_SUMMARY"

  release:
    name: Create release draft
    needs: [prepare, publish-image]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}
          fetch-depth: 0

      - name: Create English release notes after image publication
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
        run: |
          set -euo pipefail
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq '.[].tag_name' > "$RUNNER_TEMP/release-tags.txt"
          if grep --fixed-strings --line-regexp --quiet -- "$RELEASE_TAG" "$RUNNER_TEMP/release-tags.txt"; then
            echo "Release $RELEASE_TAG already exists; preserving its notes and publication status."
            exit 0
          fi
          notes="$RUNNER_TEMP/release-notes.md"
          python3 scripts/release_notes.py generate "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" --output "$notes"
          gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --verify-tag --draft --prerelease="$PRERELEASE" --latest=false \
            --title "LeetCode Daily Discord Bot ${RELEASE_TAG#v}" --notes-file "$notes"
          echo "Created an English release draft for \`$RELEASE_TAG\`; fill in the summary and highlights before publishing." >> "$GITHUB_STEP_SUMMARY"
